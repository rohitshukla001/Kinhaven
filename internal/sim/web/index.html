<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinhaven · Alexa+ simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b5573a'/%3E%3Cpath d='M8 17 16 9l8 8v7H8z' fill='%23fbf8f3'/%3E%3C/svg%3E">
<style>
  :root {
    --linen: #efe7da;
    --linen-deep: #e3d6c3;
    --ink: #2b2420;
    --ink-soft: #6d6158;
    --clay: #b5573a;
    --clay-deep: #8f3f27;
    --sage: #6f8a72;
    --glass: #121417;
    --glass-2: #1b1e23;
    --screen-text: #f4efe8;
    --screen-soft: #a9a39b;
    --amber: #f0a64a;
    --teal: #57c4b8;
    --paper: #fbf8f3;
    --line: #d9cdbb;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", "Avenir", "Segoe UI", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 15% -10%, #f7efe2 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #dccbb2 0%, transparent 55%),
      var(--linen);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    background-image: repeating-linear-gradient(0deg, rgba(80, 60, 40, 0.06) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(80, 60, 40, 0.05) 0 1px, transparent 1px 4px);
  }
  .layout {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 36px;
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 36px 40px;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  .brand h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.01em; }
  .brand span { color: var(--ink-soft); font-size: 15px; }
  .device {
    position: relative;
    padding: 18px 18px 30px;
    border-radius: 34px;
    background: linear-gradient(160deg, #2a2d33, #0e1013 70%);
    box-shadow: 0 40px 80px -30px rgba(60, 35, 15, 0.55), 0 2px 0 rgba(255, 255, 255, 0.06) inset;
  }
  .device::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -26px;
    width: 46%;
    height: 34px;
    transform: translateX(-50%);
    border-radius: 0 0 40px 40px;
    background: linear-gradient(#24262b, #15171a);
    z-index: -1;
  }
  .screen {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border-radius: 18px;
    background: radial-gradient(120% 90% at 20% 0%, #23272d 0%, var(--glass) 60%);
    color: var(--screen-text);
  }
  .status {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 22px;
    font-size: 15px;
    color: var(--screen-soft);
    z-index: 2;
  }
  .idle {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(240px, 36%);
    column-gap: 5%;
    align-content: center;
    align-items: center;
    padding: 0 7%;
    transition: opacity 0.4s ease;
  }
  .glance {
    padding: 22px 24px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: grid;
    gap: 8px;
  }
  .glance[hidden] { display: none; }
  .glance-label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--screen-soft); }
  .glance-count { font-family: var(--serif); font-size: clamp(26px, 2.8vw, 38px); line-height: 1.1; }
  .glance-line { font-size: 17px; color: #e9dfd2; }
  .glance-line.missed { color: #ff8a7a; }
  .glance-line.due { color: var(--amber); }
  .clock { font-family: var(--serif); font-size: clamp(64px, 11vw, 148px); line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .greeting { font-family: var(--serif); font-size: clamp(22px, 2.6vw, 34px); color: #e9dfd2; margin-top: 10px; }
  .try { grid-column: 1 / -1; margin-top: 34px; display: flex; flex-wrap: wrap; gap: 10px; }
  .try button {
    font: inherit;
    font-size: 16px;
    color: var(--screen-text);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .try button:hover { background: rgba(240, 166, 74, 0.18); border-color: rgba(240, 166, 74, 0.5); }
  .stage {
    position: absolute;
    inset: 48px 0 0;
    display: none;
    grid-template-rows: minmax(0, 1fr) auto;
  }
  .screen.answering .idle { opacity: 0; pointer-events: none; }
  .screen.answering .stage { display: grid; }
  .card-area { overflow: hidden; padding: 0 18px; }
  .card-area iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 16px; background: transparent; }
  .card-area.empty { display: grid; place-items: center; }
  .caption {
    margin: 0 18px 16px;
    padding: 10px 10px 0;
    font-family: var(--serif);
    font-size: clamp(15px, 1.3vw, 18px);
    line-height: 1.35;
    color: #e9dfd2;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-area.empty + .caption { font-size: clamp(26px, 3vw, 40px); color: var(--screen-text); margin: 0; padding: 0 8% 12%; border: 0; -webkit-line-clamp: 6; }
  .lightbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 6px;
    background: rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }
  .lightbar::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    background: linear-gradient(90deg, transparent, var(--amber), var(--teal), var(--amber), transparent);
    background-size: 200% 100%;
    transition: opacity 0.3s ease;
  }
  .listening .lightbar::before { opacity: 1; background: linear-gradient(90deg, var(--teal), #8ee3d9, var(--teal)); animation: breathe 1.4s ease-in-out infinite; }
  .thinking .lightbar::before { opacity: 1; animation: sweep 1.1s linear infinite; }
  .speaking .lightbar::before { opacity: 1; background: var(--amber); animation: breathe 0.9s ease-in-out infinite; }
  @keyframes sweep { from { background-position: 200% 0; } to { background-position: 0 0; } }
  @keyframes breathe { 50% { opacity: 0.45; } }
  .controls { display: flex; gap: 12px; margin-top: 44px; align-items: center; }
  .mic {
    flex: none;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 0;
    cursor: pointer;
    background: var(--clay);
    color: #fff;
    box-shadow: 0 10px 24px -10px rgba(143, 63, 39, 0.8);
    display: grid;
    place-items: center;
  }
  .mic:hover { background: var(--clay-deep); }
  .mic[aria-pressed="true"] { background: var(--sage); }
  .mic svg { width: 26px; height: 26px; }
  form.ask { flex: 1; min-width: 0; display: flex; gap: 10px; }
  form.ask input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 18px;
    padding: 0 20px;
    height: 56px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  form.ask button, .quiet {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    height: 56px;
    padding: 0 20px;
    border-radius: 16px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  .quiet { background: transparent; color: var(--ink); border-color: var(--line); }
  .toggle { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; flex: none; }
  .switch { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--line); transition: background 0.2s ease; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.2s ease; }
  .toggle[aria-checked="true"] .switch { background: var(--sage); }
  .toggle[aria-checked="true"] .switch::after { transform: translateX(16px); }
  .hint { color: var(--ink-soft); font-size: 14px; margin-top: 10px; min-height: 20px; }
  aside {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 22px 18px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 56px);
    position: sticky;
    top: 28px;
    box-shadow: 0 24px 50px -36px rgba(60, 35, 15, 0.5);
  }
  aside h2 { font-family: var(--serif); font-size: 20px; font-weight: 600; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  aside h2 small { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; margin-left: auto; }
  .log { flex: 0 1 auto; min-height: 0; overflow: auto; margin: 0 -6px 18px; padding: 0 6px; display: grid; gap: 10px; align-content: start; }
  .msg { padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4; max-width: 92%; }
  .msg.you { background: var(--linen); justify-self: end; border-bottom-right-radius: 4px; }
  .msg.bot { background: #f1ebe2; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.err { background: #fbe5df; color: var(--clay-deep); }
  .call { font-family: var(--mono); font-size: 12.5px; border-left: 3px solid var(--sage); padding: 6px 10px; background: #f3f0ea; border-radius: 0 10px 10px 0; }
  .call.app { border-left-color: var(--amber); }
  .call.fail { border-left-color: var(--clay); }
  .call b { font-weight: 700; }
  .call .tag { font-family: var(--sans); font-size: 11px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #efe1c8; color: #7a5420; }
  .call pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-soft); }
  .empty-note { color: var(--ink-soft); font-size: 14px; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; max-height: none; }
    .log { max-height: 320px; }
  }
  @media (max-width: 900px) {
    .idle { grid-template-columns: 1fr; }
    .glance { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="layout">
  <main>
    <div class="brand">
      <h1>Kinhaven</h1>
      <span>Alexa+ experience simulator · MCP server on Streamable HTTP</span>
    </div>

    <div class="device">
      <div class="screen" id="screen">
        <div class="status"><span id="date"></span><span id="mode"></span></div>
        <div class="idle">
          <div>
            <div class="clock" id="clock">--:--</div>
            <div class="greeting" id="greeting">Hello</div>
          </div>
          <section class="glance" id="glance" aria-label="Today" hidden></section>
          <div class="try" id="try"></div>
        </div>
        <div class="stage">
          <div class="card-area empty" id="card"></div>
          <div class="caption" id="caption" aria-live="polite"></div>
        </div>
        <div class="lightbar"></div>
      </div>
    </div>

    <div class="controls">
      <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="Speak a request">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <form class="ask" id="ask">
        <input id="text" autocomplete="off" maxlength="500" placeholder="Ask about Mom's medicines…" aria-label="Request">
        <button type="submit">Ask</button>
      </form>
      <button class="quiet toggle" id="voice" type="button" role="switch" aria-checked="true">Spoken replies<span class="switch" aria-hidden="true"></span></button>
      <button class="quiet" id="home" type="button">Home</button>
    </div>
    <div class="hint" id="hint"></div>
  </main>

  <aside>
    <h2>Conversation <small id="model"></small></h2>
    <div class="log" id="transcript"><p class="empty-note">Say or type a request to start.</p></div>
    <h2>MCP activity <small>tools/call</small></h2>
    <div class="log" id="activity"><p class="empty-note">Tool calls to the Kinhaven server appear here.</p></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const screen = $("screen");
const suggestions = [
  "Has Mom taken her tablets?",
  "She just took her Metformin",
  "How was her week?",
  "I feel a bit tired today",
];
const state = { sessionId: "", voice: "speechSynthesis" in window, busy: false, card: null };

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setMode(mode) {
  screen.classList.remove("listening", "thinking", "speaking");
  if (mode) screen.classList.add(mode);
  $("mode").textContent = mode ? mode[0].toUpperCase() + mode.slice(1) + "…" : "";
}

function tick() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  $("date").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  $("greeting").textContent = greeting(now.getHours());
}

function greeting(hour) {
  if (hour >= 5 && hour < 12) return "Good morning";
  if (hour >= 12 && hour < 17) return "Good afternoon";
  if (hour >= 17 && hour < 22) return "Good evening";
  return "Hello";
}

function modelLabel(id) {
  if (id === "mock") return "mock";
  const name = id.split(".").pop().replace(/-\d{8}.*$/, "").replace(/:.*$/, "");
  return "Bedrock · " + name;
}

function formatArgs(input) {
  const entries = Object.entries(input || {});
  if (!entries.length) return "no arguments";
  return entries.map(([k, v]) => k + ": " + JSON.stringify(v)).join("\n");
}

async function refreshGlance() {
  const glance = $("glance");
  const args = {};
  let result;
  try {
    result = await api("/api/tool", { name: "get_schedule", arguments: args });
  } catch {
    glance.hidden = true;
    return;
  }
  addActivity("home", "get_schedule", args, result, false);
  const data = result.structuredContent;
  if (result.isError || !data || !Array.isArray(data.doses) || !data.doses.length) {
    glance.hidden = true;
    return;
  }
  const doses = data.doses;
  const line = (cls, text) => el("div", "glance-line" + (cls ? " " + cls : ""), text);
  const parts = [
    el("div", "glance-label", "Today · " + data.name),
    el("div", "glance-count", data.summary.taken + " of " + doses.length + " doses taken"),
  ];
  const named = (status) => doses.filter((d) => d.status === status).map((d) => d.medication + " at " + d.time);
  const missed = named("missed");
  const due = named("due");
  const next = doses.find((d) => d.status === "upcoming");
  if (missed.length) parts.push(line("missed", "Missed: " + missed.join(", ")));
  if (due.length) parts.push(line("due", "Due now: " + due.join(", ")));
  if (next) parts.push(line("", "Next: " + next.medication + " at " + next.time));
  if (!missed.length && !due.length && !next) parts.push(line("", "All done for today"));
  glance.replaceChildren(...parts);
  glance.hidden = false;
}

function addMessage(who, text) {
  const log = $("transcript");
  log.querySelector(".empty-note")?.remove();
  log.append(el("div", "msg " + who, text));
  log.scrollTop = log.scrollHeight;
}

function addActivity(source, name, input, result, viaCard) {
  const log = $("activity");
  log.querySelector(".empty-note")?.remove();
  const item = el("div", "call" + (viaCard ? " app" : "") + (result && result.isError ? " fail" : ""));
  const head = el("div");
  head.append(el("span", "", source + " → "), el("b", "", name));
  if (viaCard) head.append(el("span", "tag", "MCP App"));
  item.append(head, el("pre", "", formatArgs(input)));
  if (result && result.isError) item.append(el("pre", "", (result.content || [])[0]?.text || "error"));
  log.append(item);
  log.scrollTop = log.scrollHeight;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function ask(text) {
  text = text.trim();
  if (!text || state.busy) return;
  state.busy = true;
  window.speechSynthesis?.cancel();
  addMessage("you", text);
  screen.classList.add("answering");
  $("caption").textContent = "";
  setMode("thinking");
  try {
    const turn = await api("/api/ask", { session_id: state.sessionId, text });
    state.sessionId = turn.session_id;
    for (const c of turn.calls) addActivity("assistant", c.tool, c.input, c.result, Boolean(c.resource_uri));
    const shown = await freshCard(turn.calls);
    if (shown) await mountCard(shown);
    else clearCard();
    $("caption").textContent = turn.reply;
    addMessage("bot", turn.reply);
    speak(turn.reply);
  } catch (err) {
    clearCard();
    $("caption").textContent = "Sorry, something went wrong.";
    addMessage("err", err.message);
    setMode("");
  } finally {
    state.busy = false;
  }
}

async function freshCard(calls) {
  const i = calls.findLastIndex((c) => c.resource_uri && c.result && !c.result.isError);
  if (i < 0) return null;
  const card = calls[i];
  if (!calls.slice(i + 1).some((c) => c.result && !c.result.isError)) return card;
  const result = await api("/api/tool", { name: card.tool, arguments: card.input || {} });
  addActivity("host", card.tool, card.input, result, true);
  return result.isError ? card : { ...card, result };
}

function speak(text) {
  if (!state.voice || !text) {
    setMode("");
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  u.onstart = () => setMode("speaking");
  u.onend = () => setMode("");
  u.onerror = () => setMode("");
  speechSynthesis.speak(u);
}

function fitCard() {
  const card = state.card;
  if (!card || !card.height) return;
  card.frame.style.height = Math.min(card.height, $("card").clientHeight) + "px";
}

function clearCard() {
  if (state.card) window.removeEventListener("message", state.card.listener);
  state.card = null;
  const area = $("card");
  area.replaceChildren();
  area.classList.add("empty");
}

const hostStyles = {
  "--color-background-primary": "#15181c",
  "--color-background-secondary": "#20242a",
  "--color-text-primary": "#f4efe8",
  "--color-text-secondary": "#a9a39b",
  "--color-border-primary": "#343941",
  "--font-sans": getComputedStyle(document.documentElement).getPropertyValue("--sans"),
};

async function mountCard(call) {
  const resource = await api("/api/resource?uri=" + encodeURIComponent(call.resource_uri));
  clearCard();
  const frame = document.createElement("iframe");
  frame.setAttribute("sandbox", "allow-scripts");
  frame.title = "Kinhaven card";
  frame.srcdoc = resource.text;

  const post = (msg) => frame.contentWindow?.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const listener = async (event) => {
    if (event.source !== frame.contentWindow) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    switch (msg.method) {
      case "ui/initialize":
        post({ id: msg.id, result: {
          protocolVersion: "2026-01-26",
          hostInfo: { name: "kinhaven-sim", version: "1.0.0" },
          hostCapabilities: { serverTools: {} },
          hostContext: {
            theme: "dark",
            displayMode: "inline",
            availableDisplayModes: ["inline"],
            toolInfo: { tool: { name: call.tool } },
            styles: { variables: hostStyles },
          },
        } });
        return;
      case "ui/notifications/initialized":
        post({ method: "ui/notifications/tool-input", params: { arguments: call.input || {} } });
        post({ method: "ui/notifications/tool-result", params: call.result });
        return;
      case "ui/notifications/size-changed":
        if (msg.params?.height && state.card) {
          state.card.height = Math.ceil(msg.params.height);
          fitCard();
        }
        return;
      case "ping":
        post({ id: msg.id, result: {} });
        return;
      case "tools/call":
        try {
          const result = await api("/api/tool", msg.params);
          addActivity("card", msg.params.name, msg.params.arguments, result, true);
          const speech = msg.params.name === call.tool && !result.isError && result.content?.[0]?.text;
          if (speech) $("caption").textContent = speech;
          post({ id: msg.id, result });
        } catch (err) {
          post({ id: msg.id, error: { code: -32000, message: err.message } });
        }
        return;
    }
    if (msg.id !== undefined && msg.method) {
      post({ id: msg.id, error: { code: -32601, message: "Method not supported: " + msg.method } });
    }
  };
  window.addEventListener("message", listener);
  state.card = { listener, frame, height: 0 };
  const area = $("card");
  area.classList.remove("empty");
  area.append(frame);
}

function goHome() {
  window.speechSynthesis?.cancel();
  clearCard();
  screen.classList.remove("answering");
  setMode("");
  refreshGlance();
}

function setupVoiceInput() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("mic");
  if (!Recognition) {
    mic.disabled = true;
    mic.title = "Speech recognition is not available in this browser";
    $("hint").textContent = "Voice input needs Chrome or Edge. You can type requests instead.";
    return;
  }
  const rec = new Recognition();
  rec.lang = navigator.language || "en-US";
  rec.interimResults = true;
  let finalText = "";
  rec.onstart = () => { finalText = ""; mic.setAttribute("aria-pressed", "true"); setMode("listening"); };
  rec.onresult = (e) => {
    let interim = "";
    for (const r of e.results) (r.isFinal ? (finalText = r[0].transcript) : (interim += r[0].transcript));
    $("text").value = finalText || interim;
  };
  rec.onerror = (e) => { $("hint").textContent = "Microphone: " + e.error; };
  rec.onend = () => {
    mic.setAttribute("aria-pressed", "false");
    if (finalText) { $("text").value = ""; ask(finalText); } else setMode("");
  };
  mic.addEventListener("click", () => {
    if (mic.getAttribute("aria-pressed") === "true") rec.stop();
    else { window.speechSynthesis?.cancel(); rec.start(); }
  });
}

for (const s of suggestions) {
  const b = el("button", "", "“" + s + "”");
  b.type = "button";
  b.addEventListener("click", () => ask(s));
  $("try").append(b);
}
$("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value;
  $("text").value = "";
  ask(text);
});
$("voice").addEventListener("click", (e) => {
  state.voice = !state.voice;
  e.currentTarget.setAttribute("aria-checked", String(state.voice));
  if (!state.voice) window.speechSynthesis?.cancel();
});
window.addEventListener("resize", fitCard);
$("home").addEventListener("click", goHome);
if (!("speechSynthesis" in window)) $("voice").hidden = true;

api("/api/info").then((info) => {
  $("model").textContent = modelLabel(info.model) + " · " + info.tools + " tools";
  $("model").title = info.model;
}).catch(() => {});

setupVoiceInput();
refreshGlance();
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
